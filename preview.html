<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Designs — Botanica & Celestrial</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3e8;font:12px/1.5 system-ui,sans-serif}.bar{height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;background:#f7f7f4;border-bottom:1px solid #ddd;color:#31382f}.bar strong{font-size:11px;font-weight:500;letter-spacing:.08em}.switch{display:flex;gap:4px}button{font:inherit;border:1px solid transparent;border-radius:5px;padding:7px 13px;min-height:34px;cursor:pointer;background:transparent;color:#62685f}button[aria-pressed=true]{background:#263c2d;color:#fff}.views button[aria-pressed=true]{background:#e6e8e1;color:#263c2d}button:focus-visible,a:focus-visible{outline:2px solid #548762;outline-offset:2px}a{color:inherit;text-decoration:none;font-size:11px;white-space:nowrap}iframe{display:block;width:100%;height:calc(100dvh - 54px);border:0;background:#f5f3e8}@media(max-width:780px){.bar strong{display:none}}@media(max-width:510px){.bar{height:92px;padding:8px 12px;flex-wrap:wrap;gap:2px 8px}.switch{flex:1}.views{order:3;flex-basis:100%}.views button{flex:1}button{padding:6px 10px}iframe{height:calc(100dvh - 92px)}}</style></head><body><div class="bar"><strong>DESIGNS / TWO STUDIES</strong><div class="switch" role="group" aria-label="디자인 선택"><button data-theme="botanica" aria-pressed="true">Botanica</button><button data-theme="celestrial" aria-pressed="false">Celestrial</button></div><div class="switch views" role="group" aria-label="화면 예시 선택"><button data-view="preview" aria-pressed="true">소개 화면</button><button data-view="dashboard" aria-pressed="false">대시보드</button></div><a id="open-preview" href="botanica/preview.html" target="_blank" rel="noopener">크게 보기 ↗</a></div><iframe id="preview" src="botanica/preview.html" title="Botanica 소개 화면"></iframe><script>const frame=document.getElementById('preview'),params=new URLSearchParams(location.search);let theme=params.get('theme')==='celestrial'?'celestrial':'botanica',view=params.get('view')==='dashboard'?'dashboard':'preview';function render(){document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)));document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));frame.src=`${theme}/${view}.html`;frame.title=`${theme==='botanica'?'Botanica':'Celestrial'} ${view==='dashboard'?'대시보드':'소개 화면'}`;document.getElementById('open-preview').href=frame.src;}document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{theme=b.dataset.theme;render();}));document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render();}));render();</script></body></html>
