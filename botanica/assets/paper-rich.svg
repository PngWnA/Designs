<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420"><defs>
<filter id="fiber"><feTurbulence type="fractalNoise" baseFrequency=".012 .35" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="2.2" intercept="-.55"/><feFuncG type="linear" slope="2.2" intercept="-.55"/><feFuncB type="linear" slope="2.2" intercept="-.55"/></feComponentTransfer></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="17" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<filter id="fleck"><feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="1" seed="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .32 0 0 0 0 .26 0 0 0 0 .16 0 0 0 12 -10.4"/></filter>
<filter id="tooth"><feTurbulence type="fractalNoise" baseFrequency=".07" numOctaves="4" seed="5" stitchTiles="stitch" result="n"/><feDiffuseLighting in="n" lighting-color="white" surfaceScale="2.4"><feDistantLight azimuth="45" elevation="58"/></feDiffuseLighting></filter></defs>
<rect width="100%" height="100%" filter="url(#fiber)" opacity=".10"/><rect width="100%" height="100%" filter="url(#grain)" opacity=".12"/><rect width="100%" height="100%" filter="url(#fleck)" opacity=".35"/><rect width="100%" height="100%" filter="url(#tooth)" opacity=".16"/></svg>